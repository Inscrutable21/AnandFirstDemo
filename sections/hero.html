<!-- Section 1: Hero Carousel ("A little Bling to Celebrate Your Thing") -->
    <section class="hero-section" id="heroSection">
      <div class="hero-carousel" id="heroCarousel">
        
        <!-- Slide 1 -->
        <div class="hero-slide active" data-slide="0">
          <img src="assets/RingPop_Image-1_Desktop.jpg" alt="Ring Pop Celebration Concert" class="hero-slide-bg">
          <div class="hero-slide-overlay"></div>
        </div>

        <!-- Slide 2 -->
        <div class="hero-slide" data-slide="1">
          <img src="assets/RingPop_Image2_Desktop.jpg" alt="Ring Pop Birthday Blowout" class="hero-slide-bg">
          <div class="hero-slide-overlay"></div>
        </div>

        <!-- Slide 3 -->
        <div class="hero-slide" data-slide="2">
          <img src="assets/RingPop_Image3_Desktop.jpg" alt="Friends Sharing Ring Pops" class="hero-slide-bg">
          <div class="hero-slide-overlay"></div>
        </div>

        <!-- Slide 4 -->
        <div class="hero-slide" data-slide="3">
          <img src="assets/RingPop_Image4_Desktop.jpg" alt="Colorfest Festival Vibe" class="hero-slide-bg">
          <div class="hero-slide-overlay"></div>
        </div>

        <!-- Slide 5 -->
        <div class="hero-slide" data-slide="4">
          <img src="assets/RingPop_Image5_Desktop.jpg" alt="Candy Fashion Accessory" class="hero-slide-bg">
          <div class="hero-slide-overlay"></div>
        </div>

      </div>

      <!-- Hero Floating Candies / Interactive Depth -->
      <div class="hero-floating-elements" aria-hidden="true">
        <img src="assets/Ring_Pop_Image_-_1_1.webp" alt="" class="hero-gem gem-1 float-anim-1">
        <img src="assets/Ring_Pop_Image_-_2_1.webp" alt="" class="hero-gem gem-2 float-anim-2">
        <img src="assets/Ring_Pop_Image_-_3_1.webp" alt="" class="hero-gem gem-3 float-anim-3">
      </div>

      <!-- Hero Content Overlay -->
      <div class="hero-content">
        <div class="hero-container">
          <div class="hero-badge">
            
            <span>THE ULTIMATE PARTY ACCESSORY</span>
          </div>

          <h1 class="hero-title">
            A little Bling<br>
            to Celebrate<br>
            <span class="title-highlight">Your Thing</span>
          </h1>

          <p class="hero-description">
            From stadium championships and festival front rows to birthday blowouts and wedding proposals, put a Ring Pop on it.
          </p>

          <div class="hero-actions">
            <a href="#stackingCards" class="btn-primary-pop">
              <span>Explore Products</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M5 12h14M12 5l7 7-7 7"/>
              </svg>
            </a>
            <a href="#weddingSection" class="btn-secondary-ghost">
              <span>Wedding Collection</span>
            </a>
          </div>
        </div>
      </div>

      <!-- Carousel Navigation & Indicators -->
      <div class="hero-carousel-controls">
        <button class="carousel-arrow prev" id="heroPrevBtn" aria-label="Previous Slide">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M15 19l-7-7 7-7"/>
          </svg>
        </button>

        <div class="carousel-dots" id="heroDots">
          <button class="dot active" data-index="0" aria-label="Slide 1"></button>
          <button class="dot" data-index="1" aria-label="Slide 2"></button>
          <button class="dot" data-index="2" aria-label="Slide 3"></button>
          <button class="dot" data-index="3" aria-label="Slide 4"></button>
          <button class="dot" data-index="4" aria-label="Slide 5"></button>
        </div>

        <button class="carousel-arrow next" id="heroNextBtn" aria-label="Next Slide">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M9 5l7 7-7 7"/>
          </svg>
        </button>
      </div>
    </section>
